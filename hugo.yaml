module:
  mounts:
    - source: assets
      target: assets
    - source: layouts
      target: layouts
    - source: static
      target: static

# Params
params:
  # CSS
  # No light/dark switching: the palette of a site is the palette of that site,
  # whatever the visitor's OS says. This is already the core's default, but
  # spelling it out is what keeps @uncinq/design-tokens' themes/dark.css asleep
  # — the core turns this param into data-color-scheme="light" on <html>, and
  # that attribute is exactly what the dark block excludes itself on.
  # A site that must read dark does it with its own tokens, not with this
  # switch: darkmode: true would mean "follow the OS", never "always dark".
  css:
    darkmode: false

  # Image
  # _merge: deep, because both keys already exist upstream — hero in
  # hugolify-theme, casestudies in hugolify-theme-casestudies — and what follows
  # adds to those maps instead of standing in for them.
  hero:
    _merge: deep
    image_2:
      desktop: '526x'
      mobile: '300x'
  casestudies:
    _merge: deep
    thumbnail:
      _merge: deep
      desktop: '291x'
      mobile: '235x'
